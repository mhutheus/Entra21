<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        function lerCeps() {
            fetch(`http://viacep.com.br/ws/89012-170/json/`)
                .then(dados => dados.json())
                .then(resposta => { console.log(resposta) })
                .catch(error => console.error(error.message))

            console.log('ola')
        }

        async function carregaLogradouro() {
            try {
                let dados = await fetch(`http://viacep.com.br/ws/89012-170/json/`)
                let resposta = await dados.json()
                console.log(resposta)
                console.log('ola de novo')
            }
            catch (error) {
                console.error(error.message)
            }
        }

        lerCeps()
        carregaLogradouro()

    </script>
</body>

</html>
