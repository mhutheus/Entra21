<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./cadastro.css">
    <title>Document</title>
</head>

<body>
    <div class="cadastro1">
        <h1>Cadastro de Clientes</h1>

        <form action="tabela.html" method="GET">

            <div class="coletar">
                <p>Nome</p>
                <input type="text" id="nome" name="nome" />
                <p>E-mail</p>
                <input type="text" id="eMail" name="eMail">
                <p>Telefone</p>
                <input type="text" id="numero" name="numero">
                <p>CEP</p>
                <input type="text" id="cep" name="cep">
                <br><br>
                <button type="submit">Salvar</button>
                <p id="mensagem"></p>
            </div>
            <br>
            <a href="./menu.html">Voltar ao menu</a>

        </form>



    </div>
    <script>
        const form = document.querySelector('form');
        const nomeInput = document.getElementById('nome');
        const emailInput = document.getElementById('eMail');
        const numeroInput = document.getElementById('numero');
        const mensagem = document.getElementById('mensagem');
        const cepInput = document.getElementById('cep');

        form.addEventListener('submit', function (event) {

            event.preventDefault();

            const nome = nomeInput.value.trim();
            const email = emailInput.value.trim();
            const numero = numeroInput.value.trim();
            const cep = cepInput.value.trim();

            nomeInput.classList.remove("erro", "sucesso");
            emailInput.classList.remove("erro", "sucesso");
            numeroInput.classList.remove("erro", "sucesso");
            cepInput.classList.remove("erro", "sucesso");

            mensagem.innerText = "";
            mensagem.className = "";

            let erro = false;

            if (nome.length < 3) {
                nomeInput.classList.add("erro");
                erro = true;
            } else {
                nomeInput.classList.add("sucesso");
            }

            if (!email.includes("@")) {
                emailInput.classList.add("erro");
                erro = true;
            } else {
                emailInput.classList.add("sucesso");
            }

            if (numero.length < 8) {
                numeroInput.classList.add("erro");
                erro = true;
            } else {
                numeroInput.classList.add("sucesso");
            }
            if (cep.length != 9) {
                cepInput.classList.add("erro");
                erro = true;
            } else {
                cepInput.classList.add("sucesso");
            }

            if (erro) {
                mensagem.innerText = "Preencha os campos corretamente!";
                mensagem.classList.add("erroMensagem");
                return;
            }

            const novoCliente = { nome, email, numero, cep };

            let listaClientes =
                JSON.parse(localStorage.getItem('clientes')) || [];

            const clienteExistente = listaClientes.find(cliente =>
                cliente.email === email ||
                cliente.numero === numero
            );

            if (clienteExistente) {

                emailInput.classList.add("erro");
                numeroInput.classList.add("erro");

                mensagem.innerText = "Cliente já cadastrado!";
                mensagem.classList.add("erroMensagem");

                return;
            }

            listaClientes.push(novoCliente);

            localStorage.setItem(
                'clientes',
                JSON.stringify(listaClientes)
            );

            mensagem.innerText = "Cliente salvo com sucesso!";
            mensagem.classList.add("sucessoMensagem");

            form.reset();

            nomeInput.classList.remove("sucesso");
            emailInput.classList.remove("sucesso");
            numeroInput.classList.remove("sucesso");
            cepInput.classList.remove("sucesso");
        });
    </script>

</body>

</html>
