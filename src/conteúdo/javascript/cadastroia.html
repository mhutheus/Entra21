<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 700px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        h2 {
            margin: 20px 0;
            color: #333;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 4px;
        }

        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #0d6efd;
            color: white;
            text-align: left;
            padding: 12px;
        }

        td {
            padding: 12px;
            border: 1px solid #ccc;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cadastro de Clientes</h1>

        <div class="card">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome">
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="telefone">
            </div>

            <button onclick="cadastrar()">
                Cadastrar
            </button>

        </div>

        <h2>Lista de Clientes</h2>

        <table>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Telefone</th>
                </tr>

            <tbody id="tabelaClientes">


            </tbody>

        </table>

    </div>

    <script>

        function cadastrar() {

            let nome = document.getElementById('nome').value
            let email = document.getElementById('email').value
            let telefone = document.getElementById('telefone').value

            if (nome == '' || email == '' || telefone == '') {
                alert('Preencha todos os campos')
                return
            }

            let tabela = document.getElementById('tabelaClientes')

            tabela.innerHTML += `
                <tr>
                    <td>${nome}</td>
                    <td>${email}</td>
                    <td>${telefone}</td>
                </tr>
            `

            document.getElementById('nome').value = ''
            document.getElementById('email').value = ''
            document.getElementById('telefone').value = ''
        }

    </script>

</body>

</html>
