<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./cadastro.css">
    <title>Document</title>
</head>

<body>
    <div class="cadastro">
        <h1>Cadastro de Clientes</h1>

        <div class="coletar">
            <p>Nome</p>
            <input type="text" id="nome" />
            <p>E-mail</p>
            <input type="text" id="eMail">
            <p>Telefone</p>
            <input type="text" id="numero">
            <p></p>
            <button onclick="cadastrar()">Salvar</button>
        </div>
        <div class="tabela">
            <h3>Lista de Clientes</h3>

            <table>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>

                <tbody id="tabela">

                </tbody>
            </table>
            <div class="botoes">
                <button id="btnLimpar">Limpar Todos os Clientes</button>
            </div>

        </div>
    </div>
    <script>
        function cadastrar() {
            let nome = document.getElementById('nome').value
            let eMail = document.getElementById('eMail').value
            let numero = document.getElementById('numero').value

            if (nome == '' || eMail == '' || numero == '') {
                alert('Preencha todos os campos!')
                return
            }
            if (/\d/.test(nome)) {
                alert('Nome inválido!')
                return

            }
            if (!eMail.includes('@')) {
                alert('Email inválido!')
                return
            }
            if (!/^\d+$/.test(numero)) {
                alert('Número inválido!')
                return
            }
            let tabela = document.getElementById('tabela')

            let linhas = tabela.querySelectorAll("tr")

            for (let linha of linhas) {
                let nomeExistente = linha.children[0].innerText
                let emailExistente = linha.children[1].innerText
                let numeroExistente = linha.children[2].innerText

                if (
                    nomeExistente === nome ||
                    emailExistente === eMail ||
                    numeroExistente === numero
                ) {
                    alert("Cliente já cadastrado!")
                    return
                }
            }

            // Adiciona novo cliente
            tabela.innerHTML += `
<tr>
    <td class="copiavel">${nome}</td>
    <td class="copiavel">${eMail}</td>
    <td class="copiavel">${numero}</td>
</tr>
`
        }
        const btnLimpar = document.getElementById("btnLimpar");

        btnLimpar.addEventListener("click", function () {
            localStorage.removeItem("clientes");
            window.location.reload();
        }
        );

        tabela.addEventListener("click", function (event) {
            if (event.target.tagName === "TD" && event.target.classList.contains("copiavel")) {
                const textoParaCopiar = event.target.innerText;

                navigator.clipboard.writeText(textoParaCopiar)
                    .then(() => {
                        const textoOriginal = event.target.innerText;
                        event.target.innerText = "Copiado! ✓";

                        setTimeout(() => {
                            event.target.innerText = textoOriginal;
                        }, 450);
                    })
                    .catch(err => {
                        alert("Erro ao copiar texto: ", err);
                    });
            }
        });
    </script>
</body>

</html>
