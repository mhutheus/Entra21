<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções JavaScript</title>
</head>

<body>

    <h2>Trabalhando com Funções</h2>

    <button onclick="ola()">Clique</button>

    <button id="myButton">Horas:</button>

    <p id="demo"></p>

    <p id="para"></p>
    <span id="span"></span>

    <p>Espere 3 segundos</p>

    <p id="demo2"></p>

    <p id="demo3"></p>

    <p id="demo4"></p>

    <p id="demo5"></p>

    <p id="demo6"></p>

    <button onclick="clicar()">Clique</button>

    <p id="clicarTexto"></p>

    <button onclick="passou()">Timer de 5 segundos</button>

    <p id="timer"></p>

    <button onclick="mudarCor('green')">Verde</button>
    <button onclick="mudarCor('blue')">Azul</button>
    <button onclick="mudarCor('red')">Vermelho</button>

    <br><br>

    <button onclick="carregar()">Carregar</button>

    <p id="carregarTexto"></p>

    <br><br>

    <input type="text" id="item">

    <button onclick="lista()">Salvar</button>

    <div id="lista"></div>

    <script>

        // =====================================
        // FUNÇÕES SIMPLES
        // =====================================

        console.log('Olá Mundo!')

        function ola() {
            console.log('Olá de novo!')
        }

        function dobro(n1) {
            let resultado = n1 * 2
            console.log(resultado)
        }

        function dividir(n1, n2) {
            let resultado = n1 / n2
            console.log(resultado)
        }

        function subtrair(n1, n2) {
            return n1 - n2
        }

        dobro(10)
        dividir(100, 2)

        let retorno = subtrair(100, 10)

        console.log(retorno)


        // =====================================
        // FUNÇÕES ANÔNIMAS
        // =====================================

        const gravar = function (nome) {
            console.log(`Salvando: ${nome}`)
        }

        gravar('Ana da Silva')

        const nomeCompleto = function (nome, sobrenome) {
            console.log(`${nome} ${sobrenome}`)
        }

        nomeCompleto('Ana', 'da Silva')


        // =====================================
        // ARROW FUNCTION
        // =====================================

        const media = (n1, n2) => {

            let soma = n1 + n2

            console.log(soma / 2)
        }

        media(20, 30)


        // =====================================
        // DATA E HORA
        // =====================================

        function displayDate() {

            const agora = new Date()

            const dataEmPortugues = agora.toLocaleDateString('pt-BR', {

                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'

            })

            document.getElementById('demo').innerHTML =
                dataEmPortugues
        }

        document
            .getElementById('myButton')
            .addEventListener('click', displayDate)


        // =====================================
        // CALLBACK
        // =====================================

        function mostrarEmParagrafo(valor) {

            document.getElementById('para').innerHTML =
                valor
        }

        function mostrarEmSpan(valor) {

            document.getElementById('span').innerHTML =
                valor
        }

        function calcularCallback(n1, n2, callback) {

            let soma = n1 + n2

            callback(soma)
        }

        calcularCallback(10, 20, mostrarEmParagrafo)

        calcularCallback(20, 30, mostrarEmSpan)


        // =====================================
        // SETTIMEOUT
        // =====================================

        setTimeout(() => {

            document.getElementById('demo2').innerHTML =
                'Você é mediano'

        }, 3000)


        // =====================================
        // FOREACH
        // =====================================

        const numbers = [45, 4, 9, 16, 25]

        let txt = ''
        let txtDobro = ''

        numbers.forEach(function (valor) {

            txt += valor + '<br>'

        })

        numbers.forEach(function (valor) {

            txtDobro += (valor * 2) + '<br>'

        })

        document.getElementById('demo3').innerHTML = txt

        document.getElementById('demo4').innerHTML = txtDobro


        // =====================================
        // SOMA
        // =====================================

        function calcular(n1, n2) {

            return n1 + n2
        }

        function display(resultado) {

            document.getElementById('demo5').innerHTML =
                resultado
        }

        let resultado = calcular(10, 50)

        display(resultado)


        // =====================================
        // DESAFIOS
        // =====================================

        function clicar() {

            document.getElementById('clicarTexto').innerHTML =
                'Clicado com sucesso'
        }

        function passou() {

            setTimeout(() => {

                document.getElementById('timer').innerHTML =
                    'Passou!'

            }, 5000)
        }


        // =====================================
        // CORES
        // =====================================

        function mudarCor(cor) {

            document.body.style.backgroundColor = cor
        }


        // =====================================
        // CARREGAR
        // =====================================

        function carregar() {

            document.getElementById('carregarTexto').innerHTML =
                'Carregando...'

            setTimeout(() => {

                document.getElementById('carregarTexto').innerHTML =
                    'Pronto!'

            }, 2000)
        }


        // =====================================
        // LISTA
        // =====================================

        function lista() {

            let item = document.getElementById('item')

            let lista = document.getElementById('lista')

            lista.innerHTML += `
                <p>${item.value}</p>
            `
        }
        // =====================================
        // RELOGIO
        // =====================================
        setInterval(myFunction, 1000);

        function myFunction() {
            let d = new Date();
            document.getElementById("demo6").innerHTML =
                d.getHours() + ":" +
                d.getMinutes() + ":" +
                d.getSeconds();
        }

    </script>

</body>

</html>
