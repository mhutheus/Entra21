<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu projeto</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <header>
        <h1>Aula de HTML</h1>
    </header>

    <div class="carousel">

        <button onclick="voltar()"><img src="https://img.freepik.com/vetores-premium/icone-de-seta_701361-364.jpg" class="girar"></button>

        <div class="carousel-wrapper">

            <div class="carousel-track" id="track">

                <div class="slide">
                    <subheader>
                        <p style="color:lightblue">Conteúdo</p>
                    </subheader>
                    <div class="grid">

                        <div class="card"><a href="./conteúdo/cabecalhos.html">cabeçalhos</a> </div>
                        <div class="card"><a href="./conteúdo/inputs.html">inputs</a></div>
                        <div class="card"><a href="./conteúdo/indexx.html">index</a></div>
                        <div class="card"><a href="./conteúdo/divs.html">divs</a></div>
                        <div class="card"><a href="./conteúdo/pagina.html">cards</a></div>
                        <dic class="card"><a href="./menu/menu.html">iframe</a></dic>

                    </div>
                </div>

                <div class="slide">
                    <subheader>
                        <p style="color:lightblue">Meus sites</p>
                    </subheader>
                    <div class="grid">

                        <div class="card"><a href="./meus sites/gatos.html">gatos</a></div>
                        <div class="card"><a href="./meus sites/lista.html">lista</a></div>

                    </div>
                </div>

            </div>
        </div>

        <button onclick="avancar()"><img src="https://img.freepik.com/vetores-premium/icone-de-seta_701361-364.jpg" class="seta"></button>

    </div>

    <script>
        let index = 0;

        function atualizar() {
            const track = document.getElementById("track");
            track.style.transform = `translateX(-${index * 100}%)`;
        }

        function avancar() {
            if (index < 1) {
                index++;
                atualizar();
            } 
        }

        function voltar() {
            if (index > 0) {
                index--;
                atualizar();
            }
        }
    </script>
</body>

</html>
