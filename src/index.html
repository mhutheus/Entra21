        </div>

    <script>
        let index = 0;

        function atualizar() {
            const track = document.getElementById("track");
            track.style.transform = `translateX(-${index * 100}%)`;
        }

        function avancar() {
            if (index < 2) {
                index++;
                atualizar();
            }
        }

        function voltar() {
            if (index > 0) {
                index--;
                atualizar();
            }
        }
    </script>
