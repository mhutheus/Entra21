<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
    </nav>

    <main>
        <h1>Consulta de Produtos</h1>

        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Descrição</th>
                    <th>R$</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody></tbody>
        </table>
    </main>

    <script>
        function carregarProdutos() {
            fetch('http://localhost:8080/produtos')
                .then(resp => resp.json())
                .then(dados => {
                    let tabela = document.getElementsByTagName('tbody')[0];
                    tabela.innerHTML = '';

                    dados.forEach(e => {
                        let linha = `
                            <tr>
                                <td>${e.id}</td>
                                <td>${e.descricao}</td>
                                <td>R$ ${e.preco}</td>
                                <td>${e.estoque}</td>
                                <td>
                                    <button onclick="alterar(${e.id})">Alterar</button>
                                    <button onclick="remover(${e.id})">Remover</button>
                                </td>
                            </tr>
                        `;

                        tabela.innerHTML += linha;
                    });
                });
        }

        function remover(id) {
            let confirmar = confirm('Tem certeza que deseja remover este produto?');

            if (confirmar) {
                fetch('http://localhost:8080/produtos/' + id, {
                    method: 'DELETE'
                })
                .then(resp => {
                    if (resp.ok) {
                        alert('Produto removido com sucesso!');
                        carregarProdutos();
                    } else {
                        alert('Erro ao remover produto');
                    }
                });
            }
        }

        function alterar(id) {
            fetch('http://localhost:8080/produtos/' + id)
                .then(resp => {
                    if (!resp.ok) {
                        throw new Error('Produto não encontrado');
                    }

                    return resp.json();
                })
                .then(produto => {
                    let descricao = prompt('Digite a nova descrição:', produto.descricao);
                    let preco = prompt('Digite o novo preço:', produto.preco);
                    let estoque = prompt('Digite o novo estoque:', produto.estoque);

                    if (descricao === null || preco === null || estoque === null) {
                        return;
                    }

                    let produtoAlterado = {
                        descricao: descricao,
                        preco: Number(preco),
                        estoque: Number(estoque)
                    };

                    return fetch('http://localhost:8080/produtos/' + id, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(produtoAlterado)
                    });
                })
                .then(resp => {
                    if (resp && resp.ok) {
                        alert('Produto alterado com sucesso!');
                        carregarProdutos();
                    }
                })
                .catch(erro => {
                    console.error(erro);
                    alert('Erro ao alterar produto');
                });
        }

        carregarProdutos();
    </script>
</body>

</html>
